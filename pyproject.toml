[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionaid"
version = "0.1.0"
description = "LLM vision aid auditing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic~=0.84.0",
    "beautifulsoup4>=4.9.2",
    "lxml>=4.9.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "openpyxl>=3.1.5",
    "python-dotenv~=1.2.1",
    "requests>=2.32.2",
]

[project.scripts]
visionaid-evaluate = "vision_aid.evaluation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["vision_aid*", "processing_scripts*", "entry_points*"]
namespaces = true

[tool.setuptools.package-data]
"vision_aid.evaluation" = ["pricing.v1.json", "pricing.v2.json"]
"processing_scripts.llm" = ["*.txt"]
