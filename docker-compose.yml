# Production: published images only. Coolify routes the domain to web:3000.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DATABASE_USER:-vadat}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-vadat}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backup:
    image: postgres:17
    entrypoint: [sh, /backup.sh]
    environment:
      PGHOST: db
      PGUSER: ${DATABASE_USER:-vadat}
      PGPASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      PGDATABASE: ${DATABASE_NAME:-vadat}
      BACKUP_MODE: ${BACKUP_MODE:-required}
      BACKUP_KEEP: ${BACKUP_KEEP:-10}
    configs:
      - source: backup-script
        target: /backup.sh
    volumes: [backups:/backups]
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
  migrations:
    image: ghcr.io/c4g/va-dat-web:${IMAGE_TAG:-latest}
    command: [node, /node_modules/prisma/build/index.js, migrate, deploy]
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-vadat}:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}@db:5432/${DATABASE_NAME:-vadat}
    depends_on:
      backup: {condition: service_completed_successfully}
    restart: 'no'
  api:
    image: ghcr.io/c4g/va-dat-api:${IMAGE_TAG:-latest}
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    # No LLM provider credentials: public users bring their own.
    expose: ['8000']
    read_only: true
    tmpfs: [/tmp:size=512m]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  web:
    image: ghcr.io/c4g/va-dat-web:${IMAGE_TAG:-latest}
    expose: ['3000']
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-vadat}:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}@db:5432/${DATABASE_NAME:-vadat}
      PYTHON_API_URL: http://api:8000
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public origin}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    depends_on:
      migrations: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
volumes:
  db-data:
  backups:
configs:
  backup-script:
    file: ./scripts/backup.sh
