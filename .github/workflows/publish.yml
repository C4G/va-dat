name: Publish application images
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/c4g/va-dat-api:latest
            ghcr.io/c4g/va-dat-api:${{ github.sha }}
          cache-from: type=gha,scope=api
      - name: Publish web and migrations
        uses: docker/build-push-action@v7
        with:
          context: web
          push: true
          tags: |
            ghcr.io/c4g/va-dat-web:latest
            ghcr.io/c4g/va-dat-web:${{ github.sha }}
          cache-from: type=gha,scope=web
      - name: Trigger Coolify only after both images are available
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        if: ${{ env.COOLIFY_TOKEN != '' && env.COOLIFY_APP_UUID != '' }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            "https://coolify.c4g.dev/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
