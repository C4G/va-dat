name: CI
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.11.21'
          enable-cache: true
      - run: uv lock --check && uv sync --frozen
      - name: Verify generated requirements
        run: |
          uv export --format requirements.txt --no-dev --no-emit-project --no-hashes -o requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Imports, API regression, and no-cost pipeline
        run: |
          uv run python -c 'import entry_points.api_server, entry_points.run_pipeline, entry_points.generate_report'
          uv run python -m unittest discover -s tests -v
          uv run python entry_points/run_pipeline.py --html test_files/dat_visionaid_home.html --dry-run --output-dir ./ci-output
          uv run python -c 'import json,pathlib; m=json.loads(pathlib.Path("ci-output/manifest.json").read_text()); assert m["dry_run"] and m["prompts_dry_run"]; assert not m["total_input_tokens"] and not m["total_output_tokens"]'
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.29.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint && pnpm test && pnpm format
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_PASSWORD: isolated-ci-password
      AUTH_SECRET: isolated-ci-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3317
      IMAGE_TAG: ci
      WEB_PORT: 3317
      SMOKE_ALLOW_MUTATION: '1'
      SMOKE_RECREATE_STACK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - name: Build API
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/c4g/va-dat-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web and migrations
        uses: docker/build-push-action@v7
        with:
          context: web
          load: true
          tags: ghcr.io/c4g/va-dat-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - run: docker pull postgres:17
      - run: docker compose --env-file /dev/null -p vadat-integration -f docker-compose.yml -f docker-compose.build.yml up --no-build --pull never -d
      - run: node scripts/smoke-test.mjs
      - run: node scripts/test-startup.mjs
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose --env-file /dev/null -p vadat-integration logs --tail 50
          docker compose --env-file /dev/null -p vadat-integration down --volumes
